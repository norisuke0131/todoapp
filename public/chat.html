<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>base お問い合わせチャット</title>
<meta name="description" content="パスタとピザの店 base（庭園の郷 道の駅保内）へのお問い合わせチャット。営業時間・ご予約・アクセスなど。" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Shippori+Mincho+B1:wght@600;800&display=swap" rel="stylesheet" />
<style>
  /* 色はすべてトークンで管理。店の黒板（バジル）とトマトソースを差し色にする。 */
  :root {
    --paper: #f6f1e7;
    --paper-deep: #efe7d6;
    --card: #fffdf8;
    --ink: #2a2520;
    --muted: #6e6457;
    --line: #e2d7c2;
    --basil: #2f5d46;
    --basil-deep: #234a37;
    --tomato: #b8432f;
    --tomato-soft: #f8e4dc;
    --focus: #d9891b;
    --radius: 18px;
  }
  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    background: var(--paper);
    color: var(--ink);
    font-family: "Noto Sans JP", system-ui, -apple-system, "Hiragino Kaku Gothic ProN", sans-serif;
    font-size: 16px;
    line-height: 1.7;
  }
  /* 背景の細かな格子（黒板・テーブルクロスの気配）。 */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image: radial-gradient(var(--line) 1px, transparent 1px);
    background-size: 22px 22px;
    opacity: .55;
    pointer-events: none;
    z-index: 0;
  }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

  .app {
    position: relative;
    z-index: 1;
    max-width: 560px;
    margin: 0 auto;
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
  }
  @media (min-width: 600px) {
    .app { height: min(820px, 94vh); margin-top: 3vh; padding: 0 16px; }
    .shell {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 24px;
      box-shadow: 0 18px 50px -24px rgba(42, 37, 32, .35);
      height: 100%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
  }
  .shell { display: flex; flex-direction: column; flex: 1; min-height: 0; background: var(--card); }

  /* ヘッダー：店名を明朝で。「誰が答えているか」を一目で伝える。 */
  header {
    padding: 18px 20px 16px;
    background: var(--basil);
    color: #f6f1e7;
    position: relative;
  }
  /* トラットリアのテーブルクロス（赤白ギンガム）を思わせる帯。 */
  header::after {
    content: "";
    position: absolute;
    left: 0; right: 0; bottom: -7px;
    height: 7px;
    background:
      repeating-linear-gradient(90deg, rgba(184, 67, 47, .9) 0 10px, transparent 10px 20px),
      repeating-linear-gradient(0deg, rgba(184, 67, 47, .55) 0 3px, transparent 3px 7px),
      var(--paper);
  }
  .facility { font-size: .78rem; letter-spacing: .08em; opacity: .85; margin: 0; }
  .store {
    font-family: "Shippori Mincho B1", "Noto Sans JP", serif;
    font-weight: 800;
    font-size: 1.6rem;
    margin: 2px 0 0;
    line-height: 1.2;
  }
  .lead { margin: 4px 0 0; font-size: .86rem; opacity: .92; }

  /* 会話ログ */
  .log {
    flex: 1;
    overflow-y: auto;
    padding: 22px 16px 12px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    scroll-behavior: smooth;
  }
  .msg {
    max-width: 84%;
    padding: 11px 15px;
    border-radius: var(--radius);
    white-space: pre-line;
    word-break: break-word;
    animation: rise .35s ease both;
  }
  .msg.bot {
    align-self: flex-start;
    background: var(--paper);
    border: 1px solid var(--line);
    border-top-left-radius: 6px;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--basil);
    color: #fffdf8;
    border-top-right-radius: 6px;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: none; }
  }

  .typing { align-self: flex-start; display: flex; gap: 5px; padding: 14px 16px; background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); border-top-left-radius: 6px; }
  .typing span { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite ease-in-out; }
  .typing span:nth-child(2) { animation-delay: .15s; }
  .typing span:nth-child(3) { animation-delay: .3s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; align-self: flex-start; }
  .chip {
    font: inherit;
    font-size: .88rem;
    font-weight: 500;
    color: var(--basil-deep);
    background: var(--card);
    border: 1.5px solid var(--basil);
    border-radius: 999px;
    padding: 7px 14px;
    cursor: pointer;
    min-height: 44px;
  }
  .chip:hover { background: var(--basil); color: #fffdf8; }

  .handoff {
    align-self: stretch;
    background: var(--tomato-soft);
    border: 1px solid #e7b9a9;
    border-radius: 14px;
    padding: 12px 14px;
    font-size: .9rem;
    color: var(--ink);
  }
  .handoff strong { display: block; color: var(--tomato); font-size: .82rem; letter-spacing: .04em; }
  .handoff a {
    display: inline-block;
    margin-top: 6px;
    color: var(--tomato);
    font-weight: 700;
    text-decoration: none;
    font-size: 1.05rem;
    min-height: 44px;
    line-height: 44px;
  }

  /* 入力欄 */
  form.composer {
    display: flex;
    gap: 8px;
    padding: 12px 14px 14px;
    border-top: 1px solid var(--line);
    background: var(--card);
  }
  label.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  input[type="text"] {
    flex: 1;
    min-width: 0;
    font: inherit;
    font-size: 16px; /* iOS の自動拡大を防ぐため16px以上 */
    padding: 12px 14px;
    border: 1.5px solid var(--line);
    border-radius: 14px;
    background: var(--paper);
    color: var(--ink);
  }
  input[type="text"]::placeholder { color: var(--muted); }
  button.send {
    font: inherit;
    font-weight: 700;
    color: #fffdf8;
    background: var(--tomato);
    border: 0;
    border-radius: 14px;
    padding: 0 20px;
    min-height: 48px;
    cursor: pointer;
  }
  button.send:hover { background: #9c3524; }
  button.send:disabled { opacity: .55; cursor: progress; }

  .note {
    margin: 0;
    padding: 0 16px 12px;
    font-size: .78rem;
    color: var(--muted);
    background: var(--card);
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="shell">
    <header>
      <p class="facility" id="facility">庭園の郷 道の駅保内</p>
      <h1 class="store">base</h1>
      <p class="lead">パスタとピザの店｜お問い合わせチャット</p>
    </header>

    <main class="log" id="log" aria-live="polite" aria-label="会話">
      <div class="msg bot">こんにちは、base です。営業時間・ご予約・アクセス・メニューなど、お気軽にご質問ください。</div>
      <div class="chips" id="starter" role="group" aria-label="よくあるご質問"></div>
    </main>

    <form class="composer" id="composer" autocomplete="off">
      <label class="sr" for="input">ご質問を入力</label>
      <input type="text" id="input" name="message" maxlength="300" placeholder="例：本日の営業時間は？" required />
      <button class="send" type="submit" id="send">送信</button>
    </form>
    <p class="note">回答は店舗の登録情報に基づく自動応答です。内容が違う場合や急ぎの場合は、店舗へ直接お問い合わせください。</p>
  </div>
</div>

<script>
  (() => {
    const log = document.getElementById("log");
    const form = document.getElementById("composer");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("send");
    const starter = document.getElementById("starter");
    const STARTER_CHIPS = ["営業時間", "予約", "アクセス", "メニュー"];

    /** 本文は textContent で入れる（入力内容をHTMLとして解釈させない）。 */
    function addMsg(role, text) {
      const el = document.createElement("div");
      el.className = "msg " + role;
      el.textContent = text;
      log.appendChild(el);
      scrollDown();
      return el;
    }

    function addChips(labels) {
      const wrap = document.createElement("div");
      wrap.className = "chips";
      wrap.setAttribute("role", "group");
      wrap.setAttribute("aria-label", "次のご質問の候補");
      labels.forEach((label) => {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "chip";
        b.textContent = label;
        b.addEventListener("click", () => send(label));
        wrap.appendChild(b);
      });
      log.appendChild(wrap);
      scrollDown();
    }

    function clearChips() {
      log.querySelectorAll(".chips").forEach((el) => el.remove());
    }

    function addHandoff(phone) {
      const box = document.createElement("div");
      box.className = "handoff";
      const title = document.createElement("strong");
      title.textContent = "店舗へ直接ご相談ください";
      box.appendChild(title);
      if (phone) {
        const a = document.createElement("a");
        a.href = "tel:" + phone.replace(/[^0-9+]/g, "");
        a.textContent = "📞 " + phone;
        box.appendChild(a);
      }
      log.appendChild(box);
      scrollDown();
    }

    function showTyping() {
      const el = document.createElement("div");
      el.className = "typing";
      el.id = "typing";
      el.setAttribute("aria-label", "入力中");
      el.innerHTML = "<span></span><span></span><span></span>";
      log.appendChild(el);
      scrollDown();
    }

    function hideTyping() {
      const el = document.getElementById("typing");
      if (el) el.remove();
    }

    function scrollDown() {
      log.scrollTop = log.scrollHeight;
    }

    function setBusy(busy) {
      sendBtn.disabled = busy;
      input.disabled = busy;
    }

    async function send(raw) {
      const text = String(raw).trim();
      if (!text) return;
      clearChips();
      starter.remove();
      addMsg("user", text);
      input.value = "";
      setBusy(true);
      showTyping();

      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "応答に失敗しました。");
        hideTyping();
        addMsg("bot", data.text);
        if (data.handoff) addHandoff(data.phone);
        if (Array.isArray(data.suggestions) && data.suggestions.length) addChips(data.suggestions);
      } catch (err) {
        hideTyping();
        addMsg("bot", (err && err.message ? err.message + "\n" : "") + "ただいま応答できません。お手数ですが店舗へ直接お問い合わせください。");
      } finally {
        setBusy(false);
        input.focus();
      }
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      send(input.value);
    });

    STARTER_CHIPS.forEach((label) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "chip";
      b.textContent = label;
      b.addEventListener("click", () => send(label));
      starter.appendChild(b);
    });
  })();
</script>
</body>
</html>
