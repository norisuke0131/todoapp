<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TypeSafe タスク自動分類</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #faf5ef;
    --panel: #ffffff;
    --text: #2b211a;
    --muted: #70604f;
    --border: #e8ddd0;
    --accent: #a03e15;
    --accent-ink: #ffffff;
    --accent-soft: #fbe8dc;
    --bar-bg: #f0e6da;
    --warn: #b45309;
    --warn-soft: #fdf1e2;
    --ok: #4d6333;
    --grain: rgba(43, 33, 26, 0.035);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1c1612;
      --panel: #2a211b;
      --text: #f3e9df;
      --muted: #b3a090;
      --border: #3d322a;
      --accent: #e08a4f;
      --accent-ink: #1c1612;
      --accent-soft: #3a2518;
      --bar-bg: #362c24;
      --warn: #f0b429;
      --warn-soft: #3a2f14;
      --ok: #8fae6c;
      --grain: rgba(255, 244, 230, 0.045);
    }
  }
  :root[data-theme="dark"] {
    --bg: #1c1612; --panel: #2a211b; --text: #f3e9df; --muted: #b3a090;
    --border: #3d322a; --accent: #e08a4f; --accent-ink: #1c1612; --accent-soft: #3a2518;
    --bar-bg: #362c24; --warn: #f0b429; --warn-soft: #3a2f14; --ok: #8fae6c;
    --grain: rgba(255, 244, 230, 0.045);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background-color: var(--bg); color: var(--text);
    background-image: radial-gradient(circle at 1px 1px, var(--grain) 1px, transparent 0);
    background-size: 20px 20px;
    font-family: system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
    line-height: 1.6;
  }
  body::before {
    content: ""; display: block; height: 5px;
    background: linear-gradient(90deg, var(--accent), var(--ok));
  }
  .wrap { max-width: 680px; margin: 0 auto; padding: 36px 16px 64px; }
  h1 {
    font-family: "Fraunces", Georgia, serif; font-weight: 700;
    font-size: 1.7rem; margin: 0 0 6px; letter-spacing: -.01em;
  }
  .kicker {
    font-size: .72rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase;
    color: var(--accent); margin: 0 0 8px;
  }
  .sub { color: var(--muted); margin: 0 0 28px; font-size: .92rem; max-width: 46ch; }
  .sprig { width: 18px; height: 18px; vertical-align: -3px; margin-right: 6px; color: var(--ok); }
  h2 {
    font-family: "Fraunces", Georgia, serif; font-weight: 600; font-style: italic;
    font-size: 1.2rem; margin: 44px 0 4px; color: var(--text);
  }
  .hint { color: var(--muted); font-size: .84rem; margin: 0 0 16px; }
  .card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 14px; padding: 22px; margin-bottom: 20px;
    box-shadow: 0 1px 2px rgba(43, 33, 26, 0.04);
  }
  label { display: block; font-weight: 600; font-size: .85rem; margin-bottom: 6px; }
  input[type="text"], input:not([type]), textarea {
    width: 100%; padding: 10px 12px; border: 1px solid var(--border);
    border-radius: 9px; background: var(--bg); color: var(--text);
    font-size: 1rem; font-family: inherit; margin-bottom: 14px;
  }
  textarea { resize: vertical; min-height: 60px; }
  button {
    background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 9px;
    padding: 11px 20px; font-size: 1rem; font-weight: 600; cursor: pointer;
    transition: transform .12s ease, box-shadow .12s ease, opacity .12s ease;
  }
  button:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 4px 10px rgba(43, 33, 26, 0.12); }
  button:active:not(:disabled) { transform: translateY(0); }
  button:disabled { opacity: .6; cursor: progress; }
  .examples { margin-top: 12px; font-size: .82rem; color: var(--muted); }
  .examples button {
    background: var(--accent-soft); color: var(--accent); font-weight: 500;
    padding: 4px 10px; font-size: .8rem; border-radius: 999px; margin: 3px 4px 0 0;
    box-shadow: none;
  }
  .examples button:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 2px 6px rgba(43, 33, 26, 0.1); }
  .row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .verdict { font-size: 1.05rem; font-weight: 700; }
  .conf { color: var(--muted); font-size: .85rem; font-weight: 500; }
  .flag { color: var(--warn); font-size: .8rem; font-weight: 700; }
  .metric { margin-bottom: 16px; }
  .metric .name { font-size: .78rem; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .bars { margin-top: 6px; }
  .barline { display: grid; grid-template-columns: 92px 1fr 44px; align-items: center; gap: 8px; font-size: .82rem; margin: 3px 0; }
  .track { height: 9px; background: var(--bar-bg); border-radius: 999px; overflow: hidden; }
  .fill { height: 100%; background: var(--accent); border-radius: 999px; }
  .decision { border-radius: 9px; padding: 12px 14px; font-weight: 600; font-size: .95rem; }
  .decision.review { background: var(--warn-soft); color: var(--warn); }
  .decision.auto { background: var(--accent-soft); color: var(--ok); }
  .badge { display: inline-block; font-size: .72rem; padding: 2px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-weight: 700; }
  .err { color: var(--warn); font-size: .9rem; }
  footer { color: var(--muted); font-size: .78rem; text-align: center; margin-top: 28px; }
  a { color: var(--accent); }
  .fade-in { animation: fadeUp .35s ease both; }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @media (prefers-reduced-motion: reduce) {
    button, .fade-in { transition: none !important; animation: none !important; }
    button:hover:not(:disabled) { transform: none; box-shadow: none; }
  }

  /* --- CSV一括分類：ファイル選択ゾーン --- */
  .sr-input { position: absolute; opacity: 0; width: 1px; height: 1px; overflow: hidden; }
  .dropzone {
    display: flex; align-items: center; gap: 10px; cursor: pointer;
    border: 1.5px dashed var(--border); border-radius: 10px; padding: 14px 16px;
    margin-bottom: 16px; transition: border-color .12s ease, background .12s ease;
  }
  .dropzone:hover { border-color: var(--accent); background: var(--accent-soft); }
  .dropzone .dz-label { font-weight: 600; font-size: .9rem; color: var(--accent); white-space: nowrap; }
  .dropzone .dz-file { color: var(--muted); font-size: .86rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* --- 出力形式ピル --- */
  .fmt-choice { display: flex; gap: 10px; margin-bottom: 18px; }
  .fmt-pill {
    display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
    padding: 8px 16px; border-radius: 999px; border: 1px solid var(--border);
    font-size: .85rem; font-weight: 600; color: var(--muted);
    transition: all .12s ease;
  }
  .fmt-pill.active { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .ok-msg {
    background: var(--accent-soft); color: var(--ok); border-radius: 9px;
    padding: 10px 14px; font-size: .88rem; font-weight: 600;
  }
</style>
</head>
<body>
<div class="wrap">
  <p class="kicker">base ｜ キッチンオペレーション</p>
  <h1>TypeSafe タスク自動分類</h1>
  <p class="sub">タスク文を書くだけで、TypeSafe（System One／Jev）がカテゴリ・優先度・分割要否を
    型付きの判断＋確率で仕分けます。厨房の仕込み伝票のように、迷わず次の一手がわかるように。</p>

  <div class="card">
    <label for="title">タスクのタイトル</label>
    <input id="title" placeholder="例：明日までに業務用オリーブオイルを発注する" />
    <label for="notes">補足メモ（任意）</label>
    <textarea id="notes" placeholder="例：今週の販促用"></textarea>
    <button id="go">分類する</button>
    <div class="examples">
      例をためす：
      <button class="ex" data-t="今日中に来週のスタッフシフトを確定してLINEで連絡">シフト・緊急</button>
      <button class="ex" data-t="インスタの新メニュー告知を投稿し、POPも差し替える" data-n="今週の販促">販促・複合</button>
      <button class="ex" data-t="オリーブオイルとトマト缶が切れそうなので発注">仕入れ</button>
    </div>
  </div>

  <div id="result"></div>

  <h2>
    <svg class="sprig" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
      <path d="M4 20 C4 12, 10 6, 19 4" />
      <ellipse cx="9" cy="13" rx="3.2" ry="1.7" transform="rotate(-35 9 13)" />
      <ellipse cx="14" cy="8" rx="3" ry="1.6" transform="rotate(-20 14 8)" />
      <circle cx="19.5" cy="4.5" r="1.6" fill="currentColor" stroke="none" />
    </svg>
    CSV一括分類
  </h2>
  <p class="hint">タスク一覧のCSVをアップロードすると、全件を分類してExcel（またはCSV）でダウンロードできます。</p>
  <div class="card">
    <label for="csvFile">CSVファイル</label>
    <label class="dropzone" for="csvFile">
      <span class="dz-label">ファイルを選択</span>
      <span class="dz-file" id="dzFileName">未選択</span>
      <input class="sr-input" id="csvFile" type="file" accept=".csv,text/csv" />
    </label>

    <label>出力形式</label>
    <div class="fmt-choice" id="fmtChoice">
      <label class="fmt-pill active" data-fmt="xlsx">
        <input class="sr-input" type="radio" name="fmt" value="xlsx" checked />Excel (.xlsx)
      </label>
      <label class="fmt-pill" data-fmt="csv">
        <input class="sr-input" type="radio" name="fmt" value="csv" />CSV
      </label>
    </div>

    <button id="batchGo">分類してダウンロード</button>
    <p class="hint" style="margin:12px 0 0">
      先頭行はヘッダ。<code>title</code>（または タイトル／タスク／件名）列が必須、
      <code>notes</code>（または メモ／備考）列は任意。1回あたり最大20件まで。
    </p>
  </div>
  <div id="batchResult"></div>

  <footer>
    <span class="badge" id="modeBadge">demo</span>
    モデル: <span id="modelName">—</span> ／
    <a href="https://github.com/norisuke0131/todoapp" target="_blank" rel="noopener">ソース</a>
  </footer>
</div>

<script type="module">
  const CATEGORY_LABEL = {
    work: "仕事", purchase: "仕入れ・発注", shift: "シフト",
    promotion: "販促・SNS", complaint: "クレーム対応", facility: "設備・修繕",
    hygiene: "衛生・HACCP", training: "教育・研修", home: "家庭", other: "その他",
  };
  const pct = (p) => `${Math.round(p * 100)}%`;
  const el = (id) => document.getElementById(id);

  function render(payload) {
    const r = payload.result;
    el("modeBadge").textContent = payload.mode === "live" ? "live" : "demo";
    el("modelName").textContent = r.model;

    const bars = Object.entries(r.category.probabilities)
      .sort((a, b) => b[1] - a[1])
      .map(([key, p]) => `
        <div class="barline">
          <span>${CATEGORY_LABEL[key] ?? key}</span>
          <span class="track"><span class="fill" style="width:${Math.round(p * 100)}%"></span></span>
          <span>${pct(p)}</span>
        </div>`).join("");

    const bd = r.breakdown;
    const bdText = bd.uncertain ? "判断保留（中間帯）" : bd.likely ? "分割推奨" : "分割不要";
    const catFlag = r.category.needsReview ? '<span class="flag">⚠ 要確認</span>' : "";
    const priFlag = r.priority.needsReview ? '<span class="flag">⚠ 要確認</span>' : "";

    el("result").innerHTML = `
      <div class="card fade-in">
        <div class="metric">
          <div class="name">カテゴリ</div>
          <div class="row"><span class="verdict">${r.category.label}</span>
            <span class="conf">確信度 ${pct(r.category.confidence)} ${catFlag}</span></div>
          <div class="bars">${bars}</div>
        </div>
        <div class="metric">
          <div class="name">優先度</div>
          <div class="row"><span class="verdict">${r.priority.label}</span>
            <span class="conf">レベル ${r.priority.level} ／ 確信度 ${pct(r.priority.confidence)} ${priFlag}</span></div>
        </div>
        <div class="metric">
          <div class="name">期日</div>
          <div class="row"><span class="verdict">${r.due.date ?? "なし"}</span>
            <span class="conf">${r.due.rule}</span></div>
        </div>
        <div class="metric">
          <div class="name">進捗</div>
          <div class="row"><span class="verdict">${r.progress.label}</span>
            <span class="conf">確信度 ${pct(r.progress.confidence)} ${r.progress.needsReview ? '<span class="flag">⚠ 要確認</span>' : ""}</span></div>
        </div>
        <div class="metric">
          <div class="name">分割要否</div>
          <div class="row"><span class="verdict">${bdText}</span>
            <span class="conf">Yes確率 ${pct(bd.probability)}</span></div>
        </div>
        <div class="decision ${r.needsHumanReview ? "review" : "auto"}">
          ${r.needsHumanReview
            ? "→ 一部が確信度不足のため【人間レビューに回す】"
            : "→ 全項目が高確信度のため【自動適用OK】"}
        </div>
      </div>`;
  }

  async function classify() {
    const title = el("title").value.trim();
    if (!title) { el("title").focus(); return; }
    const notes = el("notes").value.trim() || undefined;
    const btn = el("go");
    btn.disabled = true; btn.textContent = "判定中…";
    el("result").innerHTML = "";
    try {
      const res = await fetch("/api/classify", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ title, notes }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
      render(data);
    } catch (e) {
      el("result").innerHTML =
        `<div class="card err fade-in">分類に失敗しました：${e.message}</div>`;
    } finally {
      btn.disabled = false; btn.textContent = "分類する";
    }
  }

  el("go").addEventListener("click", classify);
  el("title").addEventListener("keydown", (e) => { if (e.key === "Enter") classify(); });
  document.querySelectorAll(".ex").forEach((b) =>
    b.addEventListener("click", () => {
      el("title").value = b.dataset.t;
      el("notes").value = b.dataset.n || "";
      classify();
    }));

  // --- CSV一括分類 ---
  el("csvFile").addEventListener("change", () => {
    const f = el("csvFile").files[0];
    el("dzFileName").textContent = f ? f.name : "未選択";
  });

  document.querySelectorAll('.fmt-pill input[type="radio"]').forEach((input) =>
    input.addEventListener("change", () => {
      document.querySelectorAll(".fmt-pill").forEach((p) => p.classList.remove("active"));
      input.closest(".fmt-pill").classList.add("active");
    }));

  function readFileAsText(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = () => reject(reader.error ?? new Error("ファイルの読み込みに失敗しました。"));
      reader.readAsText(file, "utf-8");
    });
  }

  async function runBatch() {
    const file = el("csvFile").files[0];
    const out = el("batchResult");
    if (!file) {
      out.innerHTML = '<div class="card err fade-in">CSVファイルを選択してください。</div>';
      return;
    }
    const format = document.querySelector('input[name="fmt"]:checked').value;
    const btn = el("batchGo");
    btn.disabled = true; btn.textContent = "分類中…";
    out.innerHTML = "";
    try {
      const csv = await readFileAsText(file);
      const res = await fetch("/api/batch", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ csv, format }),
      });
      if (!res.ok) {
        const data = await res.json().catch(() => ({}));
        throw new Error(data.error || `HTTP ${res.status}`);
      }
      const blob = await res.blob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = format === "csv" ? "result.csv" : "result.xlsx";
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      out.innerHTML = `<div class="ok-msg fade-in">✓ ${a.download} をダウンロードしました。</div>`;
    } catch (e) {
      out.innerHTML = `<div class="card err fade-in">一括分類に失敗しました：${e.message}</div>`;
    } finally {
      btn.disabled = false; btn.textContent = "分類してダウンロード";
    }
  }

  el("batchGo").addEventListener("click", runBatch);
</script>
</body>
</html>
